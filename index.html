<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>草莓 DSSAT 项目主页 · Strawberry DSSAT</title>
  <style>
    :root {
      --berry: #e63462;
      --berry-dark: #b7274c;
      --leaf: #2e7d5b;
      --cream: #fff5f7;
      --ink: #2a1a20;
      --card-radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", Segoe UI, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 15% -10%, #ffe3ea 0%, transparent 60%),
        radial-gradient(1000px 700px at 100% 0%, #e5f6ec 0%, transparent 55%),
        var(--cream);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6vh 20px;
    }
    header { text-align: center; max-width: 720px; margin-bottom: clamp(2rem, 5vw, 3.5rem); }
    .badge {
      display: inline-block;
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--berry-dark);
      background: #fff;
      border: 1px solid #f4c4cf;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 1.2rem;
    }
    h1 {
      font-size: clamp(1.9rem, 1rem + 4vw, 3.4rem);
      line-height: 1.1;
      letter-spacing: -0.01em;
    }
    h1 .berry { color: var(--berry); }
    header p { margin-top: 1rem; color: #6b5058; font-size: clamp(1rem, 0.9rem + 0.4vw, 1.15rem); }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: clamp(1.2rem, 3vw, 2rem);
      width: 100%;
      max-width: 860px;
    }
    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      background: #fff;
      border: 1px solid #f1d7dd;
      border-radius: var(--card-radius);
      padding: clamp(1.6rem, 4vw, 2.4rem);
      overflow: hidden;
      transition: transform .25s cubic-bezier(.16,1,.3,1), box-shadow .25s ease, border-color .25s ease;
      box-shadow: 0 6px 20px rgba(230, 52, 98, 0.06);
    }
    .card::before {
      content: "";
      position: absolute; inset: 0 0 auto 0; height: 6px;
      background: linear-gradient(90deg, var(--berry), #ff8fa3);
    }
    .card.leaf::before { background: linear-gradient(90deg, var(--leaf), #7fd1a8); }
    .card:hover { transform: translateY(-6px); box-shadow: 0 18px 40px rgba(230, 52, 98, 0.16); border-color: var(--berry); }
    .card.leaf:hover { border-color: var(--leaf); box-shadow: 0 18px 40px rgba(46, 125, 91, 0.16); }
    .cohort { font-size: 2.6rem; font-weight: 800; letter-spacing: -0.02em; }
    .card.berry .cohort { color: var(--berry); }
    .card.leaf .cohort { color: var(--leaf); }
    .card h2 { font-size: 1.25rem; margin: 0.5rem 0 0.4rem; }
    .card .desc { color: #74606a; font-size: 0.98rem; line-height: 1.5; flex: 1; }
    .card .go {
      margin-top: 1.4rem;
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-weight: 600;
    }
    .card.berry .go { color: var(--berry-dark); }
    .card.leaf .go { color: var(--leaf); }
    .card .go::after { content: "\2192"; transition: transform .2s ease; }
    .card:hover .go::after { transform: translateX(4px); }
    footer { margin-top: clamp(2.5rem, 6vw, 4rem); color: #9a828b; font-size: 0.85rem; text-align: center; }
    footer a { color: var(--berry-dark); }
  </style>
</head>
<body>
  <header>
    <span class="badge">CROPGRO &middot; Strawberry &middot; DSSAT</span>
    <h1><span class="berry">草莓</span>大棚作物模型 &middot; 项目主页</h1>
    <p>选择要查看的年级项目网站 &middot; Select a cohort to view its project site</p>
  </header>

  <main class="cards">
    <a class="card berry" href="2024.html">
      <span class="cohort">24级</span>
      <h2>智慧草莓大棚 &middot; 实训平台</h2>
      <p class="desc">2024 级学生开发的最新项目网站（Class of 2024）。</p>
      <span class="go">进入网站</span>
    </a>

    <a class="card leaf" href="2023.html">
      <span class="cohort">23级</span>
      <h2>草莓大棚农业模型</h2>
      <p class="desc">2023 级学生开发的项目网站，含发布 A、研发 A / B 展示（Class of 2023）。</p>
      <span class="go">进入网站</span>
    </a>
  </main>

  <footer>
    基于 DSSAT 框架的 CROPGRO-草莓作物模型 Python 实现 &middot;
    <a href="https://github.com/itsjameshan/CN-strawberryDSSAT">GitHub</a>
  </footer>
</body>
</html>
